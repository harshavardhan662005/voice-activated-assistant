<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Assistant</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; text-align: center; padding-top: 100px; color: #333; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; max-width: 400px; width: 90%; }
        h1 { margin-bottom: 10px; font-size: 24px; color: #2c3e50; }
        p { color: #7f8c8d; margin-bottom: 30px; }
        .mic-btn { background: #ec4899; color: white; border: none; width: 80px; height: 80px; border-radius: 50%; font-size: 32px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(236, 72, 153, 0.3); }
        .mic-btn:hover { background: #db2777; transform: scale(1.05); }
        .mic-btn:active { transform: scale(0.95); }
        #status { margin-top: 25px; font-size: 16px; font-weight: 600; color: #2c3e50; min-height: 40px; padding: 0 10px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Voice Assistant</h1>
        <p>Click the button and ask me anything!</p>
        
        <button id="start-btn" class="mic-btn">🎙️</button>
        
        <div id="status">Ready...</div>
    </div>

    <script>
        const btn = document.getElementById('start-btn');
        const statusText = document.getElementById('status');

        // EXACT, CLEAN BASE64 STRING - No single quotes!
        const ENCODED_KEY = "'QVEuQWI4Uk42S1Z3ZWlJck1PanNLaFlWLVFwMnlndUE4TndBSzhRQTZoR0JNWFpQUkdURGc='";
        const userApiKey = atob(ENCODED_KEY);

        const URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent";

        // STAGE 1: Web Speech Recognition (Ears)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusText.innerText = "Speech API not supported here. Please use Google Chrome.";
            btn.style.display = "none";
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';

            btn.addEventListener('click', () => {
                if (window.speechSynthesis.paused) window.speechSynthesis.resume();
                try {
                    recognition.start();
                    statusText.innerText = "🎚️ Listening... Speak now!";
                } catch (e) {
                    console.log("Microphone is already active.");
                }
            });

            recognition.onresult = (event) => {
                const command = event.results[0][0].transcript;
                statusText.innerText = `You said: "${command}"`;
                processAICommand(command);
            };

            recognition.onerror = () => {
                statusText.innerText = "⚠️ Microphone timed out. Try clicking again.";
            };
        }

        // STAGE 2: Text-to-Speech (Mouth)
        function speak(text) {
            statusText.innerText = `AI: "${text}"`;
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) utterance.voice = voices[0];
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // STAGE 3: Gemini Cloud Connection (Brain)
        async function processAICommand(command) {
            statusText.innerText = "🤖 Thinking...";

            try {
                const response = await fetch(URL, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "x-goog-api-key": userApiKey 
                    },
                    body: JSON.stringify({
                        contents: [{ 
                            parts: [{ 
                                text: `You are a helpful conversational web assistant. Keep your response short, conversational, and under two sentences: ${command}` 
                            }] 
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    console.error("Cloud Error Details:", data.error);
                    speak("I am having trouble connecting to my cloud server right now.");
                    return;
                }

                const aiResponse = data.candidates[0].content.parts[0].text;
                speak(aiResponse);

            } catch (error) {
                console.error("Network Error:", error);
                speak("I lost my connection to the internet.");
            }
        }

        window.speechSynthesis.getVoices();
    </script>
</body>
</html>
