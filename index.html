<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice-Based Assistant Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            text-align: center;
            padding-top: 100px;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 400px;
            width: 100%;
        }
        h1 { margin-bottom: 10px; font-size: 24px; color: #2c3e50; }
        p { color: #7f8c8d; margin-bottom: 30px; }
        .mic-btn {
            background: #3498db;
            color: white;
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }
        .mic-btn:hover { background: #2980b9; transform: scale(1.05); }
        .mic-btn:active { transform: scale(0.95); }
        #status {
            margin-top: 25px;
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            min-height: 27px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Voice Assistant Engine</h1>
        <p>Click the button and speak a command clear into your mic.</p>
        
        <button id="start-btn" class="mic-btn">🎙️</button>
        
        <div id="status">Ready...</div>
    </div>

  <script>
        const btn = document.getElementById('start-btn');
        const statusText = document.getElementById('status');

        // The exact, validated cloud access credential token 
        const API_KEY = "AQ.Ab8RN6lDJpBcAFBUlPBkpfup-dy3KYPHEO5DU0wabJ8zSzsE6w";

        // STAGE 3: The Ears (Web Speech API)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusText.innerText = "Speech recognition not supported here. Please use Google Chrome.";
            btn.style.display = "none";
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';

            btn.addEventListener('click', () => {
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                }
                try {
                    recognition.start();
                    statusText.innerText = "🎚️ Listening... Speak now!";
                } catch (e) {
                    console.log("Recognition already running");
                }
            });

            recognition.onresult = (event) => {
                const command = event.results[0][0].transcript;
                statusText.innerText = `You said: "${command}"`;
                
                // Pass text data to AI processing block
                processAICommand(command);
            };

            recognition.onerror = (err) => {
                statusText.innerText = "⚠️ Microphone timed out or access denied. Try again.";
                console.error(err);
            };
        }

        // STAGE 5: The Mouth (Text to Speech)
        function speak(text) {
            statusText.innerText = `AI: "${text}"`;
            const utterance = new SpeechSynthesisUtterance(text);
            
            const voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                utterance.voice = voices[0];
            }
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // STAGE 4: The AI Brain Connection
        async function processAICommand(command) {
            if (!API_KEY || API_KEY.includes("YOUR_ACTUAL")) {
                speak("Setup incomplete. Please add your valid Gemini API Key inside the code template.");
                return;
            }

            statusText.innerText = "🤖 Processing intent...";

            try {
                // Utilizing the flash endpoint for fast response generations
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `You are a conversational voice assistant. Give a short, clean response to this command in under two sentences: ${command}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    console.error(data.error);
                    speak("My AI brain structure rejected the connection. Check if your API key is valid.");
                    return;
                }

                const aiResponse = data.candidates[0].content.parts[0].text;
                speak(aiResponse);

            } catch (error) {
                console.error(error);
                speak("Connection timed out while trying to reach the cloud server.");
            }
        }

        // Pre-load audio systems inside the browser cache
        window.speechSynthesis.getVoices();
    </script>
</body>
</html>
